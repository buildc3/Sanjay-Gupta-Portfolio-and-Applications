<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Register — Sanjay Gupta</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/style.css"></head><body>
<main class="wrap">
<div id="lock" class="card" style="max-width:380px;margin:12vh auto">
  <h3>Stock Inward Register</h3><p class="hint">Enter the passcode to view and update the stock.</p>
  <form id="lockForm" style="display:grid;gap:10px;margin-top:12px">
    <input id="pass" type="password" autocomplete="current-password" placeholder="Passcode" required>
    <button class="btn">Unlock</button></form>
</div>

<div id="app" class="hide">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:24px 0 8px">
    <h2 style="margin:0">Stock Inward Register <span id="sheetsBadge" class="pill"></span></h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" id="bankBtn">🏦 Bank</button><button class="btn" id="buyBtn">＋ Buy</button><button class="btn sale" id="saleBtn">− Sale</button></div>
  </div>
  <div id="panel"></div>
  <div id="kpis" class="kpis" style="margin-top:18px"></div>

  <h3 style="margin-top:28px">Stock List <span id="lotCount" class="pill"></span></h3>
  <div class="bar"><input id="q" placeholder="Filter by article…"></div>
  <div id="lots"></div>

  <h3 style="margin-top:28px">Bank Ledger <span id="bankCount" class="pill"></span></h3>
  <div id="bank"></div>

  <h3 style="margin-top:28px">Sales History <span id="saleCount" class="pill"></span></h3>
  <div id="sales"></div>
</div>
</main>
<div id="toast" class="toast hide"></div>
<script src="/js/stock.js" type="module"></script>
<script src="/js/nav.js"></script>
</body></html>
